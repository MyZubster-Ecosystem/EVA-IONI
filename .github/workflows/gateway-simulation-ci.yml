name: EVA Simulation Gateway CI

on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-simulation-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-simulation-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install gateway dependencies
        run: npm ci --prefix gateway
      - name: Run simulation gateway tests
        run: npm test --prefix gateway
